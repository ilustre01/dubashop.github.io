<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DubaShop - Panel de Administración</title>
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>DubaShop - Panel de Administración</h1>
        </header>
        
        <div id="login-form">
            <h2>Iniciar Sesión</h2>
            <form id="login">
                <div class="input-group">
                    <input type="password" id="password" required>
                    <label for="password">Contraseña</label>
                </div>
                <button type="submit" class="btn">Ingresar</button>
            </form>
        </div>

        <div id="admin-panel" style="display: none;">
            <nav>
                <button id="add-product-btn" class="btn active">Añadir Producto</button>
                <button id="view-products-btn" class="btn">Ver Productos</button>
                <button id="delete-old-products-btn" class="btn">Eliminar Productos Viejos</button>
            </nav>

            <div id="add-product-form">
                <h2>Añadir Nuevo Producto</h2>
                <form id="product-form">
                    <div class="form-row">
                        <div class="input-group">
                            <input type="text" id="nombre" required>
                            <label for="nombre">Nombre del producto</label>
                        </div>
                        <div class="input-group">
                            <input type="number" id="precio" step="0.01" required>
                            <label for="precio">Precio</label>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="input-group">
                            <select id="categoria" required>
                                <option value="">Seleccione una categoría</option>
                                <option value="Ferreteria">Ferreteria</option>
                                <option value="Aseo">Aseo</option>
                                <option value="Utiles del Hogar">Utiles del Hogar</option>
                                <option value="Ropa Zapatos">Ropa Zapatos</option>
                                <option value="Otros">Otros</option>
                                <option value="nuevas-llegadas">Nuevas Llegadas</option>
                                <option value="mas-vendidos">Más Vendidos</option>
                                <option value="ofertas-especiales">Ofertas Especiales</option>
                            </select>
                            <label for="categoria">Categoría</label>
                        </div>
                        <div class="input-group">
                            <input type="text" id="subcategoria">
                            <label for="subcategoria">Subcategoría (opcional)</label>
                        </div>
                    </div>
                    <div class="input-group">
                        <textarea id="descripcion" required></textarea>
                        <label for="descripcion">Descripción</label>
                    </div>
                    <div class="form-row">
                        <div class="input-group">
                            <input type="file" id="imagen" accept="image/*" required>
                            <label for="imagen">Imagen del producto</label>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="descuento">
                            <label for="descuento">Aplicar descuento del 10%</label>
                        </div>
                    </div>
                    <button type="submit" class="btn">Añadir Producto</button>
                </form>
            </div>

            <div id="product-list" style="display: none;">
                <h2>Productos Existentes</h2>
                <div id="product-items"></div>
            </div>

            <div id="delete-old-products" style="display: none;">
                <h2>Eliminar Productos Viejos</h2>
                <p>Seleccione la fecha límite para eliminar productos más antiguos:</p>
                <input type="date" id="delete-date" required>
                <button id="confirm-delete" class="btn">Eliminar Productos Antiguos</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="admin.js"></script>
</body>
</html>
